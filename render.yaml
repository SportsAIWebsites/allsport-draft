services:
  - type: web
    name: allsport-draft
    env: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn allsport_draft_web:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: allsport-draft-db
          property: connectionString

databases:
  - name: allsport-draft-db
    plan: free

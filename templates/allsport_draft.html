<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All-Sport Redraft</title>
  <style>
    :root {
      --bg: #0e0e0f;
      --panel: #17181a;
      --panel2: #1c1d1f;
      --border: #b8362d;
      --text: #f0f0f0;
      --muted: #9a9fa6;
      --accent: #22c55e;
      --accent-light: #3ddb79;
      --warn: #e0b62c;
      --danger: #b8362d;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    .view-hidden { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    /* Header, tabs, and the mobile sub-tab bar are all fixed-height flex
       children; .layout/.myteam-view take exactly what's left via flex:1.
       No hardcoded "100vh minus N px" math -- that broke as soon as any of
       these rows wrapped or rendered a different height than assumed,
       clipping content with nothing to scroll it into view. */
    header {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 20px;
      padding: 16px 28px; background: var(--panel); border-bottom: 2px solid var(--border);
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.2px; color: var(--border); }
    header .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
    header .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
    header button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    header button:hover { background: var(--border); }

    /* Player Rankings is the primary panel — that's what you scroll through
       constantly while drafting, so it takes the entire left side, full
       height. The clock/your-picks panel and the pick-history board (just
       reference material once a draft is underway) stack on the right. */
    .layout {
      display: grid;
      grid-template-columns: minmax(600px, 1.5fr) minmax(420px, 1.1fr);
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "rankings mine"
        "rankings board";
      gap: 20px;
      padding: 20px 28px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      width: 100%;
    }
    .rankings-col { grid-area: rankings; }
    .mine-col { grid-area: mine; }
    .board-col { grid-area: board; }

    .col { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .col h2 {
      margin: 0; padding: 14px 18px; font-size: 13px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--border);
      font-weight: 700;
    }
    .col-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1; padding: 4px 0; }

    /* ---- Sport badges ---- */
    .sport-badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
      letter-spacing: 0.4px; display: inline-block; min-width: 38px; text-align: center;
    }
    .sport-NFL { background: #3a2020; color: #e0837a; }
    .sport-MLB { background: #1f2f4a; color: #7aa8e0; }
    .sport-NHL { background: #202f3a; color: #7ad0e0; }
    .sport-NBA { background: #2a1f3a; color: #b78ae0; }
    .sport-CBB { background: #2f3a20; color: #a8d47a; }
    .sport-CFB { background: #3a3320; color: #d4b87a; }

    /* ---- Injury/status badges ---- */
    .status-badge {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
      letter-spacing: 0.4px; display: inline-block; margin-left: 6px; vertical-align: middle;
    }
    .status-Q { background: rgba(214, 168, 33, 0.18); color: var(--warn); }
    .status-D { background: rgba(214, 133, 33, 0.18); color: #d68521; }
    .status-IR, .status-IL, .status-OUT { background: rgba(213, 83, 83, 0.18); color: var(--danger); }

    /* ---- Draft board ---- */
    .board { padding: 6px 18px 18px; }
    .round-header {
      position: sticky; top: 0; background: var(--panel);
      font-size: 12px; text-transform: uppercase; color: var(--accent-light);
      padding: 16px 0 8px; border-bottom: 1px solid var(--border);
      letter-spacing: 1px; font-weight: 700;
    }
    .pick-row {
      display: grid; grid-template-columns: 48px 120px 1fr 64px 140px; gap: 14px;
      padding: 12px 10px; border-bottom: 1px solid var(--panel2);
      align-items: center; border-radius: 6px;
    }
    .pick-row:nth-child(even) { background: rgba(184,54,45,0.08); }
    .pick-row.mine { background: rgba(34,197,94,0.16); }
    .pick-row.current { background: rgba(214, 168, 33, 0.14); box-shadow: inset 4px 0 0 var(--warn); }
    .pick-num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
    .pick-team { color: var(--muted); font-size: 13px; }
    .pick-player { font-weight: 500; font-size: 14px; }
    .pick-meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .pick-empty .pick-player { color: var(--muted); font-style: italic; font-weight: normal; }

    .status-msg { padding: 10px 24px; font-size: 13px; color: var(--muted); min-height: 14px; }
    .status-msg.error { color: var(--danger); }
    .status-msg.ok { color: var(--ok); }

    .roster-list { padding: 4px 0; }
    .roster-group-header {
      padding: 12px 18px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); background: var(--panel2);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .roster-group-header:first-child { border-top: none; }
    .roster-group-header span { font-weight: 400; text-transform: none; letter-spacing: 0; }
    .roster-item {
      padding: 12px 18px; display: grid; grid-template-columns: 108px 1fr auto auto;
      gap: 14px; align-items: center; font-size: 13px; border-bottom: 1px solid var(--panel2);
    }
    .roster-item:nth-child(even) { background: rgba(184,54,45,0.08); }
    .tag-group { display: flex; gap: 6px; align-items: center; }
    .pos-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--panel2); color: var(--muted); text-align: center; }
    .roster-empty { padding: 24px 18px; color: var(--muted); font-style: italic; font-size: 13px; }

    /* ---- Rankings ---- */
    .rankings-head {
      display: grid; grid-template-columns: 30px 36px 54px 1fr 54px 50px 56px 84px 64px;
      gap: 10px; padding: 10px 18px; font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      background: var(--panel2); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 2; font-weight: 700;
    }
    .rankings-list { padding: 0 0 8px; }
    .rank-row {
      display: grid; grid-template-columns: 30px 36px 54px 1fr 54px 50px 56px 84px 64px;
      gap: 10px; padding: 10px 18px; font-size: 13px;
      border-bottom: 1px solid var(--panel2); align-items: center;
      cursor: default;
    }
    .rank-row:nth-child(even) { background: rgba(184,54,45,0.08); }
    .rank-row.available.my-turn { cursor: pointer; }
    .rank-row.available.my-turn:hover { background: rgba(34,197,94,0.18); }
    .rank-row.favorited { background: rgba(214, 168, 33, 0.08); }
    .star-btn {
      background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1;
      color: var(--muted); padding: 0; width: 100%;
    }
    .star-btn.active { color: var(--warn); }
    .star-btn:hover { color: var(--warn); }
    .favorites-toggle {
      background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
      padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
      white-space: nowrap;
    }
    .favorites-toggle.active { background: rgba(214, 168, 33, 0.16); color: var(--warn); border-color: var(--warn); }
    .rank-row .rank-n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
    .rank-row .rank-name { font-weight: 500; }
    .rank-row .rank-name small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
    .rank-row .num { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-row .score {
      text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-light);
      background: rgba(34,197,94,0.14); border-radius: 5px; padding: 3px 0;
    }
    .rankings-search {
      padding: 14px 18px; background: var(--panel2); border-bottom: 1px solid var(--border);
      display: flex; gap: 10px;
    }
    .rankings-search input { flex: 1; padding: 9px 12px; font-size: 13px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
    .rankings-search select { padding: 9px 10px; font-size: 13px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }

    /* ---- Tabs ---- */
    /* ---- Turn banner ---- */
    .turn-banner {
      padding: 14px 24px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--border);
      background: var(--panel2); color: var(--muted);
    }
    .turn-banner.mine { background: rgba(34,197,94,0.16); color: var(--accent-light); }
    .turn-banner .sub { font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ---- Player detail modal ---- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-card {
      background: var(--panel); border: 2px solid var(--border); border-radius: 12px;
      width: 420px; max-width: 90vw; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 20px 24px; background: var(--panel2); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .modal-header .name { font-size: 20px; font-weight: 700; }
    .modal-header .close-btn {
      background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1;
      padding: 4px;
    }
    .modal-header .close-btn:hover { color: var(--text); }
    .modal-stats { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .modal-stat .n { font-size: 22px; font-weight: 700; }
    .modal-stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }
    .modal-actions { padding: 16px 24px 24px; }
    .modal-draft-btn {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .modal-draft-btn:hover { background: var(--accent-light); }
    .modal-draft-btn:disabled { background: var(--panel2); color: var(--muted); cursor: not-allowed; }
    .modal-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

    .tabs { display: flex; gap: 4px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .tab-btn {
      background: transparent; color: var(--muted); border: none; padding: 7px 16px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-btn:not(.active):hover { color: var(--text); }

    /* ---- My Team view ---- */
    .myteam-view { padding: 20px 28px; flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .myteam-summary {
      display: flex; gap: 24px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .myteam-stat { }
    .myteam-stat .n { font-size: 26px; font-weight: 700; }
    .myteam-stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }
    .myteam-groups {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;
    }
    .myteam-group { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .myteam-group-header {
      padding: 12px 18px; font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .myteam-player {
      display: grid; grid-template-columns: 44px 1fr auto auto auto; gap: 12px;
      padding: 12px 18px; align-items: center; font-size: 13px; border-bottom: 1px solid var(--panel2);
    }
    .myteam-player:last-child { border-bottom: none; }
    .myteam-player:nth-child(even) { background: rgba(184,54,45,0.08); }
    .myteam-player .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
    .myteam-empty { padding: 60px 24px; text-align: center; color: var(--muted); font-size: 15px; }


    /* Responsive overrides live here, at the END of the stylesheet.
       They must come after every base component rule they override --
       CSS resolves equal-specificity conflicts by source order, so a
       media query declared earlier than the base rules it's meant to
       override silently loses the cascade even when its condition
       matches. (That's exactly what happened before: these blocks sat
       near the top of the file, so later base rules for .rank-row,
       .pick-row, .roster-item, .rankings-head, and .myteam-view were
       always winning on mobile regardless of viewport width.) */
    @media (max-width: 1400px) and (min-width: 821px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(320px, 1fr);
        grid-template-areas: "mine" "rankings";
        overflow-y: auto;
      }
      .board-col { display: none; }
    }

    /* ---- Phone: same theme/components, but only one panel on screen at a
       time (a real 3-column grid cannot be shrunk to phone width and stay
       readable) with a small sub-tab bar to switch between them. ---- */
    .mobile-subtabs { display: none; }
    @media (max-width: 820px) {
      header { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
      header h1 { font-size: 16px; }
      header h1 .subtitle-text { display: none; }
      header .meta { display: none; }
      .tabs { order: 3; width: 100%; }
      .tab-btn { flex: 1; }

      .mobile-subtabs {
        flex: 0 0 auto;
        display: flex; gap: 4px; padding: 10px 14px; background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .mobile-subtabs button {
        flex: 1; background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
        padding: 9px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
      }
      .mobile-subtabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

      .layout {
        display: block;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        padding: 12px;
      }
      /* The single visible panel fills the fixed-height layout and scrolls
         internally via its own .col-body, same pattern as desktop -- an
         auto-height column here left long lists (600+ players) with no
         bounded scroll area, so anything past one screen's worth silently
         never got a scrollbar. */
      .layout .col { display: none; height: 100%; }
      .layout .col.mobile-active { display: flex; }

      .myteam-view { padding: 12px; }
      .myteam-groups { grid-template-columns: 1fr; }
      .myteam-summary { gap: 14px; padding: 16px; }
      .modal-card { width: 92vw; }

      /* The 9-column rankings grid (star/#/sport/name/pos/age/pos-rank/team/
         pts) is a desktop-width layout -- on a phone the fixed columns alone
         add up to well over the viewport, forcing an ugly horizontal
         squeeze/scroll. Below 820px it becomes a two-line card instead:
         star + rank# + sport badge + name on line one (name wraps the row),
         then pos-rank/team/pts as small chips on line two. Plain Pos and
         Age are dropped here -- Pos Rank already encodes position (e.g.
         "RB4") and Age is the least decision-relevant stat at a glance. */
      .rankings-head { display: none; }
      .rank-row {
        display: flex; flex-wrap: wrap; align-items: center;
        column-gap: 8px; row-gap: 4px; padding: 10px 14px;
      }
      .rank-row .rank-name { flex: 1 1 100%; order: 1; }
      .rank-row > *:nth-child(5), .rank-row > *:nth-child(6) { display: none; }
      .rank-row > *:nth-child(7), .rank-row > *:nth-child(8), .rank-row > *:nth-child(9) {
        order: 2; flex: 0 0 auto;
      }
      .rank-row .score { padding: 2px 8px; }
      .pick-row { grid-template-columns: 30px 1fr 44px 90px; gap: 8px; font-size: 12px; }
      .pick-team { display: none; }
      .roster-item { grid-template-columns: auto 1fr 40px 46px; gap: 8px; padding: 10px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>All-Sport Redraft <span class="subtitle-text" style="color:var(--muted); font-weight:400;">· 6 sports, 1 board</span></h1>
    <div class="tabs">
      <button class="tab-btn active" id="tab-draft" data-view="draft">Draft</button>
      <button class="tab-btn" id="tab-myteam" data-view="myteam">My Team</button>
    </div>
    <div class="meta" id="slot-meta"></div>
    <button id="pause-btn" class="view-hidden">Pause</button>
    <button id="reset-btn" class="view-hidden">New Draft</button>
  </header>

  <div class="mobile-subtabs" id="mobile-subtabs">
    <button class="active" data-panel="rankings-col">Rankings</button>
    <button data-panel="mine-col">My Picks</button>
    <button data-panel="board-col">Board</button>
  </div>

  <div class="myteam-view view-hidden" id="myteam-view"></div>

  <div class="modal-overlay" id="player-modal" style="display:none;"></div>

  <div class="layout" id="draft-layout">
    <!-- Column 1: Draft board -->
    <div class="col board-col">
      <h2>Draft Board</h2>
      <div class="col-body" id="board"></div>
    </div>

    <!-- Column 2: Your picks so far -->
    <div class="col mine-col">
      <div id="turn-banner" class="turn-banner"></div>
      <div id="status-msg" class="status-msg"></div>
      <h2>Your Picks So Far</h2>
      <div class="col-body" id="roster"></div>
    </div>

    <!-- Column 3: Full rankings -->
    <div class="col rankings-col mobile-active">
      <h2>Player Rankings</h2>
      <div class="rankings-search">
        <input id="rank-filter" type="text" placeholder="filter by name or position…" />
        <select id="sport-filter">
          <option value="">All sports</option>
          <option value="NFL">NFL</option>
          <option value="MLB">MLB</option>
          <option value="NHL">NHL</option>
          <option value="NBA">NBA</option>
          <option value="CBB">CBB</option>
          <option value="CFB">CFB</option>
        </select>
        <button class="favorites-toggle" id="favorites-toggle" title="Show only starred players">★ Favorites</button>
      </div>
      <div class="rankings-head">
        <div></div><div>#</div><div>Sport</div><div>Player</div><div>Pos</div><div>Age</div>
        <div title="Rank among players at this position (real expert rankings, where available)">Pos Rank</div>
        <div title="Team">Team</div>
        <div style="text-align:center">2025 Pts</div>
      </div>
      <div class="col-body" id="rankings"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const path = location.pathname.replace(/^\/+/, "").toLowerCase();
    let VIEWER_PARAM = (params.get("team") || path || "").toLowerCase();
    let STATE = null;
    let FILTER = "";
    let SPORT_FILTER = "";
    let VIEW = "draft";
    let OPEN_MODAL_PLAYER = null;
    let FAVORITES_ONLY = false;
    // Favorites are a personal watchlist, not shared draft state -- stored
    // per-browser (keyed by viewer so You and Bruner on the same device
    // don't share a list) rather than round-tripped through the server.
    const FAVORITES_KEY = "allsport_favorites_" + (VIEWER_PARAM || "spectator");
    let FAVORITES = new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]"));

    function toggleFavorite(name) {
      if (FAVORITES.has(name)) FAVORITES.delete(name); else FAVORITES.add(name);
      localStorage.setItem(FAVORITES_KEY, JSON.stringify([...FAVORITES]));
      renderRankings();
      renderPlayerModal();
    }

    function apiUrl(base) {
      const u = new URL(base, location.origin);
      if (VIEWER_PARAM) u.searchParams.set("team", VIEWER_PARAM);
      return u.toString();
    }

    async function fetchState() {
      const r = await fetch(apiUrl("/api/state"));
      STATE = await r.json();
      render();
    }

    async function makePick(name) {
      const r = await fetch(apiUrl("/api/pick"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player: name }),
      });
      const data = await r.json();
      if (!data.ok) {
        setStatus(data.message, "error");
      } else {
        setStatus(data.message, "ok");
        setTimeout(() => setStatus("", ""), 2500);
      }
      STATE = data.state;
      render();
    }

    async function resetDraft() {
      const r = await fetch(apiUrl("/api/reset"), { method: "POST" });
      const data = await r.json();
      STATE = data.state;
      setStatus("New draft rolled.", "ok");
      setTimeout(() => setStatus("", ""), 2000);
      render();
    }

    async function togglePause() {
      const endpoint = STATE.paused ? "/api/resume" : "/api/pause";
      const r = await fetch(apiUrl(endpoint), { method: "POST" });
      const data = await r.json();
      STATE = data.state;
      setStatus(STATE.paused ? "Draft paused." : "Draft resumed.", "ok");
      setTimeout(() => setStatus("", ""), 2000);
      render();
    }

    function setStatus(msg, cls) {
      const el = $("status-msg");
      el.textContent = msg;
      el.className = "status-msg " + (cls || "");
    }

    function render() {
      const totalPicks = STATE.total_picks;
      $("slot-meta").textContent =
        `${STATE.rounds} rounds · ${STATE.roster_size}-player rosters · pick ${STATE.current_overall ?? "—"}/${totalPicks}`;
      // Only the "You" seat can start a new draft or pause it -- Bruner's
      // link never shows either button.
      $("reset-btn").classList.toggle("view-hidden", STATE.viewer !== "You");
      $("pause-btn").classList.toggle("view-hidden", STATE.viewer !== "You");
      $("pause-btn").textContent = STATE.paused ? "Resume" : "Pause";
      renderTurnBanner();
      renderBoard();
      renderRoster();
      renderRankings();
      renderMyTeam();
      renderPlayerModal();
    }

    function renderTurnBanner() {
      const el = $("turn-banner");
      if (STATE.complete) {
        el.className = "turn-banner";
        el.innerHTML = `Draft complete <div class="sub">Final ${STATE.roster_size}-player rosters set</div>`;
        return;
      }
      const isMine = STATE.is_viewer_turn;
      let sub = `Round ${STATE.current_round}, pick #${STATE.current_overall} overall`;
      if (STATE.paused) {
        sub += ` · ⏸ paused`;
      } else if (STATE.seconds_left !== null) {
        const s = STATE.seconds_left;
        const clockText = s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s}s`;
        sub += ` · auto-picks in ${clockText}`;
      }
      el.className = "turn-banner" + (isMine ? " mine" : "");
      let extra = "";
      if (STATE.viewer && STATE.viewer_missing_sports && STATE.viewer_missing_sports.length) {
        const urgent = STATE.viewer_missing_urgent;
        extra = `<div class="sub" style="color:${urgent ? "var(--danger)" : "var(--warn)"}; margin-top:4px;">
          ${urgent ? "⚠ Must draft from" : "Still need"} ${STATE.viewer_missing_sports.join(", ")} before your roster fills up
        </div>`;
      }
      el.innerHTML = `${isMine ? "★ You're on the clock" : `${STATE.current_team} is on the clock`}<div class="sub">${sub}</div>${extra}`;
    }

    function openPlayerModal(name) {
      OPEN_MODAL_PLAYER = name;
      renderPlayerModal();
    }

    // Re-renders the currently-open modal (if any) from the latest STATE.
    // Called on every poll tick so a modal left open across a turn change
    // reflects reality instead of freezing whatever was true the moment
    // it was first opened.
    function renderPlayerModal() {
      if (!OPEN_MODAL_PLAYER) return;
      const p = STATE.rankings.find(r => r.name === OPEN_MODAL_PLAYER);
      const modal = $("player-modal");
      if (!p) {
        // Someone else drafted this player while the modal was open.
        closePlayerModal();
        return;
      }
      const canDraft = STATE.is_viewer_turn;
      const isFav = FAVORITES.has(p.name);
      modal.innerHTML = `
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <div class="name">${p.name} <button class="star-btn${isFav ? " active" : ""}" id="modal-star-btn" style="font-size:18px; vertical-align:middle;" title="${isFav ? "Remove from favorites" : "Add to favorites"}">${isFav ? "★" : "☆"}</button></div>
              <span class="sport-badge sport-${p.sport}">${p.sport}</span> <span class="pos-badge">${p.pos}</span>
            </div>
            <button class="close-btn" id="modal-close">&times;</button>
          </div>
          <div class="modal-stats">
            <div class="modal-stat"><div class="n">${p.age_display}</div><div class="l">Age / Class</div></div>
            <div class="modal-stat"><div class="n">${p.draft_value.toFixed(1)}</div><div class="l">Draft Value</div></div>
            <div class="modal-stat"><div class="n">${p.pos}${p.pos_rank || "-"}</div><div class="l">Pos Rank</div></div>
            <div class="modal-stat"><div class="n">${p.team || "—"}</div><div class="l">Team</div></div>
          </div>
          <div class="modal-actions">
            <button class="modal-draft-btn" id="modal-draft-btn" ${canDraft ? "" : "disabled"}>
              ${canDraft ? `Draft ${p.name}` : "Not your turn"}
            </button>
            ${canDraft ? "" : `<div class="modal-hint">${STATE.current_team} is currently on the clock.</div>`}
          </div>
        </div>
      `;
      modal.style.display = "flex";
      $("modal-close").addEventListener("click", closePlayerModal);
      $("modal-star-btn").addEventListener("click", () => toggleFavorite(p.name));
      modal.addEventListener("click", (e) => { if (e.target === modal) closePlayerModal(); });
      if (canDraft) {
        $("modal-draft-btn").addEventListener("click", () => {
          makePick(p.name);
          closePlayerModal();
        });
      }
    }

    function closePlayerModal() {
      OPEN_MODAL_PLAYER = null;
      const modal = $("player-modal");
      modal.style.display = "none";
      modal.innerHTML = "";
    }

    function setView(view) {
      VIEW = view;
      // Toggle a class rather than setting style.display directly -- an
      // inline display value beats every CSS rule, including the media
      // queries that switch .layout between grid (desktop) and block
      // (mobile). Setting it inline here meant the first tab switch
      // permanently pinned .layout to "grid" and broke the mobile
      // single-panel layout for the rest of the session.
      document.getElementById("draft-layout").classList.toggle("view-hidden", view !== "draft");
      document.getElementById("myteam-view").classList.toggle("view-hidden", view !== "myteam");
      // The Rankings/My Picks/Board sub-tab bar only controls panels inside
      // draft-layout -- leaving it visible (and clickable, doing nothing)
      // while on My Team was the "tab switching feels bugged" report.
      document.getElementById("mobile-subtabs").classList.toggle("view-hidden", view !== "draft");
      document.getElementById("tab-draft").classList.toggle("active", view === "draft");
      document.getElementById("tab-myteam").classList.toggle("active", view === "myteam");
    }

    function renderMyTeam() {
      const el = $("myteam-view");
      if (VIEW !== "myteam") return;
      const roster = STATE.rosters[STATE.viewer] || [];
      if (!STATE.viewer) {
        setPanelHTML(el, "myteam", `<div class="myteam-empty">Spectating — add ?team=you or ?team=bruner to see a roster.</div>`);
        return;
      }
      if (!roster.length) {
        setPanelHTML(el, "myteam", `<div class="myteam-empty">No picks yet — head to the Draft tab to make your first pick.</div>`);
        return;
      }
      const avgValue = roster.reduce((s, p) => s + p.draft_value, 0) / roster.length;
      const bySport = {};
      for (const p of roster) (bySport[p.sport] = bySport[p.sport] || []).push(p);
      const sports = Object.keys(bySport).sort();
      const html = `
        <div class="myteam-summary">
          <div class="myteam-stat"><div class="n">${STATE.viewer}</div><div class="l">Team</div></div>
          <div class="myteam-stat"><div class="n">${roster.length}/${STATE.roster_size}</div><div class="l">Roster spots filled</div></div>
          <div class="myteam-stat"><div class="n">${sports.length}</div><div class="l">Sports rostered</div></div>
          <div class="myteam-stat"><div class="n">${avgValue.toFixed(1)}</div><div class="l">Avg player value</div></div>
        </div>
        <div class="myteam-groups">
          ${sports.map(sport => {
            const players = bySport[sport].slice().sort((a, b) => b.draft_value - a.draft_value);
            return `
              <div class="myteam-group">
                <div class="myteam-group-header">
                  <span><span class="sport-badge sport-${sport}">${sport}</span> ${sport}</span>
                  <span>${players.length} player${players.length === 1 ? "" : "s"}</span>
                </div>
                ${players.map(p => `
                  <div class="myteam-player">
                    <div class="pos-badge">${p.pos}</div>
                    <div>${p.name}${p.status ? `<span class="status-badge status-${p.status}">${p.status}</span>` : ""} <small style="color:var(--muted)">${p.age_display}</small></div>
                    <div class="num">${p.pos}${p.pos_rank || "-"}</div>
                    <div class="num">${p.team || "—"}</div>
                    <div class="num" style="font-weight:600; color:var(--accent-light);">${p.draft_value.toFixed(1)}</div>
                  </div>
                `).join("")}
              </div>
            `;
          }).join("")}
        </div>
      `;
      setPanelHTML(el, "myteam", html);
    }

    function renderBoard() {
      const el = $("board");
      const html = [];
      html.push(`<div class="board">`);
      const picksByOverall = {};
      for (const rnd of STATE.board_rounds) for (const pk of rnd) picksByOverall[pk.overall] = pk;
      const teamsN = STATE.teams.length;

      for (let r = 1; r <= STATE.rounds; r++) {
        html.push(`<div class="round-header">Round ${r}</div>`);
        const start = (r - 1) * teamsN;
        for (let i = 0; i < teamsN; i++) {
          const overall = start + i + 1;
          const team = STATE.draft_order[start + i];
          const pk = picksByOverall[overall];
          const isCur = overall === STATE.current_overall;
          const isMine = team === STATE.viewer;
          const cls = ["pick-row"];
          if (isMine) cls.push("mine");
          if (isCur) cls.push("current");
          if (!pk) cls.push("pick-empty");
          if (pk) {
            const p = pk.player;
            html.push(`
              <div class="${cls.join(" ")}">
                <div class="pick-num">${overall}.</div>
                <div class="pick-team">${team}</div>
                <div class="pick-player"><span class="sport-badge sport-${p.sport}">${p.sport}</span> ${p.name}</div>
                <div class="pick-player" style="color:var(--muted); font-weight:400;">${p.pos}</div>
                <div class="pick-meta">${p.age_display} · ${p.pos}${p.pos_rank || "-"} · ${p.draft_value.toFixed(1)}</div>
              </div>
            `);
          } else {
            html.push(`
              <div class="${cls.join(" ")}">
                <div class="pick-num">${overall}.</div>
                <div class="pick-team">${team}</div>
                <div class="pick-player">${isCur ? "— on the clock —" : "—"}</div>
                <div class="pick-player"></div>
                <div class="pick-meta"></div>
              </div>
            `);
          }
        }
      }
      html.push(`</div>`);
      const rebuilt = setPanelHTML(el, "board", html.join(""));
      // Only jump to the on-the-clock pick when it actually moved (a new
      // pick landed) or this is the first render -- not on every no-op
      // poll, which is what made the board feel like it kept yanking you
      // back to the top while you were trying to scroll through history.
      if (rebuilt && STATE.current_overall !== LAST_BOARD_SCROLLED_OVERALL) {
        LAST_BOARD_SCROLLED_OVERALL = STATE.current_overall;
        const curEl = el.querySelector(".pick-row.current");
        if (curEl) curEl.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }
    let LAST_BOARD_SCROLLED_OVERALL = null;

    function renderRoster() {
      const el = $("roster");
      const roster = STATE.rosters[STATE.viewer] || [];
      if (!roster.length) {
        setPanelHTML(el, "roster", `<div class="roster-empty">No picks yet.</div>`);
        return;
      }
      const bySport = {};
      for (const p of roster) (bySport[p.sport] = bySport[p.sport] || []).push(p);
      const sports = Object.keys(bySport).sort();
      const html = `<div class="roster-list">${
        sports.map(sport => `
          <div class="roster-group-header">${sport} <span>(${bySport[sport].length})</span></div>
          ${bySport[sport].map((p) => `
            <div class="roster-item">
              <div class="tag-group">
                <span class="sport-badge sport-${p.sport}">${p.sport}</span><span class="pos-badge">${p.pos}</span>
              </div>
              <div>${p.name} <small style="color:var(--muted)">${p.age_display}</small></div>
              <div style="color:var(--muted); font-size:11px;">${p.pos}${p.pos_rank || "-"}</div>
              <div style="font-weight:600; color:var(--accent-light);">${p.draft_value.toFixed(1)}</div>
            </div>
          `).join("")}
        `).join("")
      }</div>`;
      setPanelHTML(el, "roster", html);
    }

    // The 2s poll re-renders every panel constantly. Rebuilding a panel's
    // DOM every time -- even when the content is byte-for-byte identical --
    // resets its scrollTop to 0 and can interrupt an in-progress touch
    // scroll. setPanelHTML() skips the rebuild entirely when nothing
    // changed, and preserves scroll position on the rebuilds that do
    // happen. Returns true if it actually rebuilt (used by renderBoard to
    // gate its scroll-to-current-pick behavior).
    const LAST_PANEL_HTML = {};
    function setPanelHTML(el, cacheKey, html) {
      if (LAST_PANEL_HTML[cacheKey] === html) return false;
      LAST_PANEL_HTML[cacheKey] = html;
      const scrollTop = el.scrollTop;
      el.innerHTML = html;
      el.scrollTop = scrollTop;
      return true;
    }

    function renderRankings() {
      const el = $("rankings");
      const f = FILTER.toLowerCase();
      const rows = STATE.rankings
        .filter(p => (!f || p.name.toLowerCase().includes(f) || p.pos.toLowerCase().includes(f)) && (!SPORT_FILTER || p.sport === SPORT_FILTER))
        .filter(p => !FAVORITES_ONLY || FAVORITES.has(p.name))
        .map((p, idx) => {
          const isFav = FAVORITES.has(p.name);
          const cls = ["rank-row", "available"];
          if (STATE.is_viewer_turn) cls.push("my-turn");
          if (isFav) cls.push("favorited");
          return `
            <div class="${cls.join(" ")}" data-name="${p.name.replace(/"/g, "&quot;")}">
              <button class="star-btn${isFav ? " active" : ""}" data-star="${p.name.replace(/"/g, "&quot;")}" title="${isFav ? "Remove from favorites" : "Add to favorites"}">${isFav ? "★" : "☆"}</button>
              <div class="rank-n">${idx + 1}</div>
              <div><span class="sport-badge sport-${p.sport}">${p.sport}</span></div>
              <div class="rank-name">${p.name}${p.status ? `<span class="status-badge status-${p.status}">${p.status}</span>` : ""}</div>
              <div class="num">${p.pos}</div>
              <div class="num">${p.age_display}</div>
              <div class="num">${p.pos_rank ? p.pos + p.pos_rank : "-"}</div>
              <div class="num">${p.team || "—"}</div>
              <div class="score">${p.last_value.toFixed(1)}</div>
            </div>
          `;
        });
      const html = `<div class="rankings-list">${rows.join("")}</div>`;
      if (!setPanelHTML(el, "rankings", html)) return;
      for (const row of el.querySelectorAll(".rank-row.available")) {
        row.addEventListener("click", () => openPlayerModal(row.dataset.name));
      }
      for (const star of el.querySelectorAll(".star-btn")) {
        star.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(star.dataset.star);
        });
      }
    }

    document.getElementById("reset-btn").addEventListener("click", resetDraft);
    document.getElementById("pause-btn").addEventListener("click", togglePause);
    document.getElementById("tab-draft").addEventListener("click", () => { setView("draft"); if (STATE) render(); });
    document.getElementById("tab-myteam").addEventListener("click", () => { setView("myteam"); if (STATE) render(); });
    for (const btn of document.querySelectorAll("#mobile-subtabs button")) {
      btn.addEventListener("click", () => {
        for (const b of document.querySelectorAll("#mobile-subtabs button")) b.classList.remove("active");
        btn.classList.add("active");
        for (const col of document.querySelectorAll(".layout .col")) col.classList.remove("mobile-active");
        document.querySelector("." + btn.dataset.panel).classList.add("mobile-active");
      });
    }
    document.getElementById("rank-filter").addEventListener("input", (e) => {
      FILTER = e.target.value;
      renderRankings();
    });
    document.getElementById("sport-filter").addEventListener("change", (e) => {
      SPORT_FILTER = e.target.value;
      renderRankings();
    });
    document.getElementById("favorites-toggle").addEventListener("click", () => {
      FAVORITES_ONLY = !FAVORITES_ONLY;
      document.getElementById("favorites-toggle").classList.toggle("active", FAVORITES_ONLY);
      renderRankings();
    });

    fetchState();
    setInterval(fetchState, 2000);
    // Browsers throttle setInterval heavily in backgrounded/inactive tabs
    // (sometimes to once a minute or less) -- without this, a phone with
    // the tab open but not focused could sit on stale "not your turn"
    // state indefinitely even though the server had long since moved on.
    // Force an immediate refetch the moment the tab becomes active again.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") fetchState();
    });
    window.addEventListener("focus", fetchState);
  </script>
</body>
</html>
